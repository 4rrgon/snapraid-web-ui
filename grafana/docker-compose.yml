services:
  backend:
    build: .
    container_name: snapraid-backend
    command: sh -c "cd backend && npm start"
    ports:
      - "3000:3000"
    environment:
      SECRET: somesecret
      ADMINEMAIL: admin@example.com
      ADMINPASSWORD: Password1!
      CONFIG: /etc/snapraid.conf
    volumes:
      - /etc/snapraid.conf:/etc/snapraid.conf:ro
    restart: unless-stopped

  frontend:
    build: .
    container_name: snapraid-frontend
    command: sh -c "cd frontend && npm start"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

